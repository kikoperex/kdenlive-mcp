name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # libmlt7 already ships libmltqt.so; xvfb gives Qt5/MLT a real display.
          sudo apt-get install -y ffmpeg melt xvfb xauth libxkbcommon-x11-0 libxcb-xinerama0
          ffmpeg -version | head -n 1
          melt --version | head -n 1
          dpkg-query -W -f='${Package} ${Version}\n' 'melt' 'libmlt*' 2>/dev/null || true

      - name: Verify Python version
        run: |
          python3 --version
          python3 -c "import sys; want = tuple(map(int, '${{ matrix.python }}'.split('.'))); got = sys.version_info[:2]; assert got == want, 'expected Python %s, got %s' % (want, got)"

      - name: Server smoke test
        run: |
          python3 server.py --version
          python3 server.py --list-tools

      - name: End-to-end tests
        timeout-minutes: 8
        env:
          KD_TEST_DIR: ${{ runner.temp }}/kdenlive-mcp-test
          QT_QPA_PLATFORM: xcb
        run: |
          set +e
          set -o pipefail
          timeout --signal=KILL 240 xvfb-run -a --server-args="-screen 0 1280x720x24" \
            python3 -u tests/test_e2e.py 2>&1 | tee /tmp/e2e.log
          rc=$?
          if [ $rc -ne 0 ]; then
            tail -n 30 /tmp/e2e.log | while IFS= read -r line; do
              echo "::error title=e2e tail::$(printf '%s' "$line" | sed 's/%/%25/g')"
            done
          fi
          exit $rc

  package:
    name: package (sdist/wheel)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python3 -m pip install --upgrade pip build twine
          python3 -m build

      - name: Check package metadata
        run: python3 -m twine check --strict dist/*

      - name: Install wheel into a venv and smoke test
        run: |
          python3 -m venv /tmp/kdenlive-mlt-mcp-venv
          /tmp/kdenlive-mlt-mcp-venv/bin/python -m pip install --upgrade pip
          /tmp/kdenlive-mlt-mcp-venv/bin/python -m pip install dist/*.whl
          /tmp/kdenlive-mlt-mcp-venv/bin/kdenlive-mcp --version
          /tmp/kdenlive-mlt-mcp-venv/bin/kdenlive-mcp --list-tools
