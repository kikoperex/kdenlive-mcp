name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: e2e (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg melt
          ffmpeg -version | head -n 1
          melt --version | head -n 1

      - name: Verify Python version
        run: |
          python3 --version
          python3 -c "import sys; want = tuple(map(int, '${{ matrix.python }}'.split('.'))); got = sys.version_info[:2]; assert got == want, 'expected Python %s, got %s' % (want, got)"

      - name: Server smoke test
        run: |
          python3 server.py --version
          python3 server.py --list-tools

      - name: End-to-end tests
        env:
          KD_TEST_DIR: ${{ runner.temp }}/kdenlive-mcp-test
        run: python3 tests/test_e2e.py
