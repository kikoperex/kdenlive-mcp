name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # MLT's kdenlivetitle and qtblend modules need a Qt platform even when
      # nothing is displayed; offscreen keeps the runner headless.
      QT_QPA_PLATFORM: offscreen
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          packages="ffmpeg melt"
          if apt-cache show libmltqt7 >/dev/null 2>&1; then
            packages="$packages libmltqt7"
          else
            echo "::warning title=libmltqt7 unavailable::Ubuntu package libmltqt7 was not found; continuing with ffmpeg+melt. qtblend/kdenlivetitle may fail in headless runs."
          fi
          sudo apt-get install -y $packages
          ffmpeg -version | head -n 1
          melt --version | head -n 1
          dpkg-query -W -f='${Package} ${Version}\n' 'melt' 'libmlt*' 2>/dev/null || true

      - name: Verify Python version
        run: |
          python3 --version
          python3 -c "import sys; want = tuple(map(int, '${{ matrix.python }}'.split('.'))); got = sys.version_info[:2]; assert got == want, 'expected Python %s, got %s' % (want, got)"

      - name: Server smoke test
        run: |
          python3 server.py --version
          python3 server.py --list-tools

      - name: End-to-end tests
        timeout-minutes: 20
        env:
          KD_TEST_DIR: ${{ runner.temp }}/kdenlive-mcp-test
        run: timeout --signal=KILL 900 python3 -u tests/test_e2e.py

  package:
    name: package (sdist/wheel)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python3 -m pip install --upgrade pip build twine
          python3 -m build

      - name: Check package metadata
        run: python3 -m twine check --strict dist/*

      - name: Install wheel into a venv and smoke test
        run: |
          python3 -m venv /tmp/kdenlive-mlt-mcp-venv
          /tmp/kdenlive-mlt-mcp-venv/bin/python -m pip install --upgrade pip
          /tmp/kdenlive-mlt-mcp-venv/bin/python -m pip install dist/*.whl
          /tmp/kdenlive-mlt-mcp-venv/bin/kdenlive-mcp --version
          /tmp/kdenlive-mlt-mcp-venv/bin/kdenlive-mcp --list-tools
