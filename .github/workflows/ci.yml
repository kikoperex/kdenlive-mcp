name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compat:
    name: compat (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Compile and smoke test
        run: |
          python3 -m py_compile server.py kdenlive_mcp/*.py tests/test_e2e.py
          python3 server.py --version
          python3 server.py --list-tools

  e2e:
    name: e2e (Debian sid, MLT 7.42)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: buildpack-deps:sid-scm
    env:
      KD_TEST_DIR: /tmp/kdenlive-mcp-test
      KD_MELT_TIMEOUT: "90"
      QT_QPA_PLATFORM: xcb
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            python3 ffmpeg melt xvfb xauth libxkbcommon-x11-0 \
            libxcb-xinerama0 libgl1-mesa-dri libglx-mesa0
          QT_QPA_PLATFORM=offscreen melt -query producers 2>/dev/null | grep -q kdenlivetitle || { echo "::error title=MLT Qt module missing::kdenlivetitle producer unavailable"; exit 1; }
          QT_QPA_PLATFORM=offscreen melt -query filters 2>/dev/null | grep -q qtblend || { echo "::error title=MLT Qt module missing::qtblend filter unavailable"; exit 1; }
          python3 --version
          melt --version | head -n 1
          if ! melt --version | head -n 1 | grep -q '7\.42'; then
            echo "::warning title=MLT version drift::expected MLT 7.42, got $(melt --version | head -n 1)"
          fi

      - name: Server smoke test
        run: |
          python3 server.py --version
          python3 server.py --list-tools

      - name: End-to-end tests
        timeout-minutes: 12
        run: |
          set +e
          timeout --kill-after=10 300 xvfb-run -a \
            --server-args="-screen 0 1280x720x24 +extension GLX" \
            python3 -u tests/test_e2e.py > /tmp/e2e.log 2>&1
          rc=$?
          tail -n 30 /tmp/e2e.log
          if [ "$rc" -ne 0 ]; then
            if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
              echo "::error title=e2e hard timeout::hard timeout / killed (rc=$rc)"
            fi
            grep -E 'FAIL|SKIP' /tmp/e2e.log | head -n 4 | while IFS= read -r line; do
              echo "::error title=e2e failure::$(printf '%s' "$line" | sed -e 's/%/%25/g' -e 's/\r/%0D/g')"
            done
            if [ -f "$KD_TEST_DIR/server-stderr.log" ]; then
              grep -E 'Traceback|Error|tool crash' "$KD_TEST_DIR/server-stderr.log" | head -n 3 | while IFS= read -r line; do
                echo "::error title=server stderr::$(printf '%s' "$line" | sed -e 's/%/%25/g' -e 's/\r/%0D/g')"
              done
            fi
          else
            grep -qE "all [0-9]+ checks passed" /tmp/e2e.log || { echo "::error title=e2e summary missing::suite did not report a passing summary"; rc=1; }
            if [ "$rc" -eq 0 ]; then
              SUMMARY_LINE="$(grep -E "all [0-9]+ checks passed" /tmp/e2e.log | tail -n 1)"
              echo "$SUMMARY_LINE"
              grep -qE "all (12[0-9]|1[3-9][0-9]) checks" /tmp/e2e.log || echo "::warning title=e2e check count::check count dropped below 120: $SUMMARY_LINE"
              {
                echo "### e2e"
                echo "$SUMMARY_LINE"
                echo '```'
                melt --version | head -n 1
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          exit "$rc"

  package:
    name: package (sdist/wheel)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python3 -m pip install --upgrade pip build twine
          python3 -m build

      - name: Check package metadata
        run: python3 -m twine check --strict dist/*

      - name: Install wheel into a venv and smoke test
        run: |
          python3 -m venv /tmp/kdenlive-mlt-mcp-venv
          /tmp/kdenlive-mlt-mcp-venv/bin/python -m pip install --upgrade pip
          /tmp/kdenlive-mlt-mcp-venv/bin/python -m pip install dist/*.whl
          /tmp/kdenlive-mlt-mcp-venv/bin/kdenlive-mcp --version
          /tmp/kdenlive-mlt-mcp-venv/bin/kdenlive-mcp --list-tools

      - name: Install sdist into a second venv and smoke test
        run: |
          python3 -m venv /tmp/kdenlive-mlt-mcp-sdist
          /tmp/kdenlive-mlt-mcp-sdist/bin/python -m pip install --upgrade pip
          /tmp/kdenlive-mlt-mcp-sdist/bin/python -m pip install dist/*.tar.gz
          /tmp/kdenlive-mlt-mcp-sdist/bin/kdenlive-mcp --version
