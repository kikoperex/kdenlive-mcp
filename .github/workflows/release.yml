name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: GitHub Release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="$(python3 -c 'import kdenlive_mcp; print(kdenlive_mcp.__version__)')"
          if [ -z "$VERSION" ]; then
            echo "::error title=release tag check::could not read __version__ from kdenlive_mcp/__init__.py"
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error title=release tag mismatch::tag $GITHUB_REF_NAME does not match v$VERSION"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches package version $VERSION"

      - name: Build sdist and wheel
        run: |
          python3 -m pip install --upgrade pip build twine
          python3 -m build

      - name: Check package metadata
        run: python3 -m twine check --strict dist/*

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
